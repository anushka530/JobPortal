# Existing configurations
spring.application.name=JobPortal

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jobportal;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourPassword123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration for SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

spring.web.resources.static-locations=file:photos/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB





